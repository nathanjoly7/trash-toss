<!doctype html>
<!-- Banc d'essai local : reproduit l'iframe et le pont de l'app GeoGaming (embedded.tsx). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Banc GeoGaming</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
    #scene { display: block; width: 100%; height: calc(100vh - 32px); border: 0; }
    #log { height: 32px; line-height: 32px; padding: 0 12px; background: #222; }
  </style>
</head>
<body>
  <div id="log">En attente du message de fin…</div>
  <iframe id="scene"></iframe>
  <script>
    // ?src=… pour tester une autre version, par exemple celle publiée sur GitHub Pages.
    const src = new URLSearchParams(location.search).get('src') || `${location.origin}/dist/index.html`;
    const embeddedCode = `<iframe src="${src}" allow="fullscreen; autoplay"
      style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>`;
    const bridge = `<script>
      window.addEventListener('message', function (event) {
        window.parent.postMessage(JSON.stringify({ from: 'iframe', data: event.data }), '*');
      });
    <\/script>`;
    document.getElementById('scene').srcdoc = `<!doctype html><html><head><meta charset="utf-8">${bridge}
      <style>html,body{margin:0;padding:0;height:100%;overflow:auto}</style></head>
      <body>${embeddedCode}</body></html>`;
    window.received = [];
    window.addEventListener('message', (event) => {
      const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      window.received.push(msg);
      if (msg?.from === 'iframe' && msg?.data?.completed) {
        document.getElementById('log').textContent = 'Étape validée : ' + JSON.stringify(msg.data);
      }
    });
  </script>
</body>
</html>
